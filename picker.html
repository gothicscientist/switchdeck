<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Centre board picker</title>
<style>
:root{--bg:#f5f4f0;--fg:#1c1b19;--muted:#77736b;--line:#e2dfd7;--card:#fff;--accent:#1c1b19}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,system-ui,sans-serif;padding:0 max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px))}
header{position:sticky;top:0;background:var(--bg);padding:16px 0 12px;border-bottom:1px solid var(--line);z-index:2}
h1{font-size:18px;margin:0 0 4px}
.hint{margin:0;color:var(--muted);font-size:13px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.card.on{outline:2px solid var(--accent)}
.pic{height:120px;background-color:#fff;background-repeat:no-repeat;background-position:center;background-size:contain}
.meta{padding:8px 10px 10px}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.tick{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--card);border:1px solid var(--line)}
.card.on .tick{background:var(--accent);border-color:var(--accent)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;justify-content:space-between}
button{font:inherit;background:var(--accent);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
#count{color:var(--muted);font-variant-numeric:tabular-nums}
#out{width:100%;margin-top:8px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;display:none;box-sizing:border-box;min-height:70px}
</style></head>
<body>
<header><h1>Pick the three centre boards</h1><p class="hint">Tap up to three boards. Then press Copy picks and send the list back.</p></header>
<div id="grid"></div>
<textarea id="out" readonly></textarea>
<footer><span id="count">0 picked</span><button id="copy">Copy picks</button></footer>
<script src="data/builder-catalog.js"></script>
<script>
const boards=window.SWITCHDECK_CATALOG.cases.filter(c=>c.photo&&Array.isArray(c.photo.box)&&c.photo.bg===null);
const picked=new Set();
const grid=document.getElementById('grid');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
grid.innerHTML=boards.map((c,i)=>{
  const label=(c.brand&&!c.name.toLowerCase().startsWith(c.brand.toLowerCase())?c.brand+' ':'')+c.name;
  return `<div class="card" data-i="${i}" role="checkbox" aria-checked="false" tabindex="0" aria-label="${esc(label)}">
    <span class="tick"></span>
    <div class="pic" style="background-image:url('${esc(c.photo.img)}')"></div>
    <div class="meta"><div class="name">${esc(label)}</div><div class="price">$${Math.round(c.price).toLocaleString('en-US')}</div></div></div>`;
}).join('');
const labelOf=i=>{const c=boards[i];return (c.brand&&!c.name.toLowerCase().startsWith(c.brand.toLowerCase())?c.brand+' ':'')+c.name};
function toggle(card){
  const i=+card.dataset.i;
  if(picked.has(i)) picked.delete(i); else picked.add(i);
  card.classList.toggle('on',picked.has(i)); card.setAttribute('aria-checked',picked.has(i));
  document.getElementById('count').textContent=picked.size+' picked';
}
grid.addEventListener('click',e=>{const c=e.target.closest('.card'); if(c) toggle(c)});
grid.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')){const c=e.target.closest('.card'); if(c){e.preventDefault(); toggle(c)}}});
document.getElementById('copy').addEventListener('click',async()=>{
  const text=[...picked].map(labelOf).join('\n')||'Nothing picked';
  const out=document.getElementById('out'); out.style.display='block'; out.value=text;
  try{await navigator.clipboard.writeText(text)}catch(e){out.select()}
  document.getElementById('copy').textContent=picked.size?'Copied':'Nothing picked';
});
</script>
</body></html>
