name: Refresh keyboard catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/part-names.js'
      - 'assets/product-links.js'
      - 'package*.json'
      - '.github/workflows/catalog.yml'
  # Daily at 09:17 UTC. A failed refresh leaves the site on the last good catalog.
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: catalog-snapshots-${{ github.run_id }}
          restore-keys: catalog-snapshots-
      - run: npm ci
      - run: npm run catalog:sync
      - run: npm run catalog:check
      - run: npm run catalog:audit
      - name: Run tests
        shell: bash
        # run logs aren't readable from cloud sessions, so failing test names are also posted as annotations
        run: |
          npm test 2>&1 | tee test.log; s=${PIPESTATUS[0]}
          grep -E '^ *not ok' test.log | sed 's/^ */::error::/' || true
          exit $s
      - name: Commit validated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebase a generated-data commit if a site edit landed during the crawl.
          # Conflicting catalog edits fail safely instead of overwriting main.
          git add -A data/ docs/catalog-after.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh sourced keyboard parts catalog"
            git pull --rebase origin main
            git push
          fi
      - name: Refresh summary
        if: always()
        run: |
          node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("data/catalog-manifest.json"));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Thock catalog\n\nGenerated: ${m.generatedAt}\n\n${m.listingCount} listings\n\n`+m.sources.map(s=>`- ${s.name}: ${s.status}${s.error?" — "+s.error.replace(/\n/g," "):""}`).join("\n"))'
