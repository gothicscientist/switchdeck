name: Refresh keyboard catalog
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: catalog-snapshots-${{ github.run_id }}
          restore-keys: catalog-snapshots-
      - run: npm ci
      - run: npm run catalog:sync
      - run: npm run catalog:check
      - run: npm test
      - name: Commit validated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh sourced keyboard parts catalog"
            git push
          fi
